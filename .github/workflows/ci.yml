name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Smoke report (no performance threshold)
        run: python -m benchmarks.matmul --backend cpu --size 32 --warmup 1 --iterations 2 --output results/ci-cpu-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: cpu-smoke-report
          path: results/ci-cpu-smoke.json
          retention-days: 7
